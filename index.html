<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d3f36a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Koronosori (کرنوسری)</title>
    <meta name="description" content="محاسبه‌گر تخصصی فواصل و درجات هفت دستگاه اصلی موسیقی ایرانی (شور، سه‌گاه، چهارگاه، ماهور، همایون، نوا، راست‌پنجگاه) با کوک دقیق ربع‌پرده‌ای و تحلیل آکادمیک ردیف." />
    <meta property="og:title" content="Koronosori (کرنوسری)" />
    <meta property="og:description" content="محاسبه‌گر تخصصی فواصل و درجات هفت دستگاه اصلی موسیقی ایرانی (شور، سه‌گاه، چهارگاه، ماهور، همایون، نوا، راست‌پنجگاه) با کوک دقیق ربع‌پرده‌ای و تحلیل آکادمیک ردیف." />
    <meta property="og:type" content="website" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Vazirmatn', 'sans-serif'],
            },
            colors: {
              'brand-lime': '#d3f36a', 
              'brand-dark': '#1A1A1A', 
              'brand-gray': '#F3F4F6', 
              'brand-surface': '#FFFFFF', 
            },
            animation: {
              'fade-out': 'fadeOut 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0', visibility: 'hidden' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
      body {
        -webkit-tap-highlight-color: transparent;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
</head>
  <body class="bg-brand-gray text-brand-dark min-h-screen overflow-x-hidden selection:bg-brand-lime selection:text-brand-dark">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
